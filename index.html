<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1c130c" />
    <meta
      name="description"
      content="マインスイーパーの推理と採掘探索を組み合わせたスマートフォン向けPWAゲーム。"
    />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>Minewalker</title>
    <style>
      html,
      body,
      #app,
      #game-root {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #0b0f12;
      }

      #loading-screen {
        position: fixed;
        z-index: 10;
        inset: 0;
        display: grid;
        place-content: center;
        justify-items: center;
        color: #f7ead1;
        font-family: "MinewalkerJP", "Noto Sans JP", sans-serif;
      }

      #loading-screen img {
        image-rendering: pixelated;
      }

      #loading-screen h1 {
        margin: 12px 0 0;
        color: #ffb13b;
        font-size: 36px;
      }

      #loading-screen p {
        margin: 4px 0 0;
        font-size: 16px;
      }
    </style>
  </head>
  <body>
    <main id="app">
      <div id="loading-screen" aria-label="Minewalkerを読み込み中">
        <img src="/icons/icon-192.png" width="96" height="96" alt="" />
        <h1>Minewalker</h1>
        <p>マインウォーカー</p>
      </div>
      <div
        id="game-root"
        role="application"
        aria-label="Minewalker game canvas"
      ></div>
      <div id="ui-root"></div>
    </main>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
